<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Struktur Project Next.js</title>
  <desc id="desc">Diagram struktur folder Next.js dengan app sebagai route, public sebagai asset, lib sebagai helper, dan content sebagai materi.</desc>
  <rect width="960" height="520" rx="28" fill="#111827"/>
  <text x="480" y="58" fill="#f9fafb" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Struktur Project Next.js</text>
  <rect x="70" y="105" width="820" height="340" rx="22" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
  <text x="110" y="155" fill="#fbbf24" font-family="Arial, sans-serif" font-size="26" font-weight="700">nextjs-essentials/</text>
  <g font-family="Arial, sans-serif" font-size="22">
    <text x="145" y="205" fill="#93c5fd">app/</text>
    <text x="360" y="205" fill="#d1d5db">Route, page, layout</text>
    <text x="145" y="250" fill="#86efac">content/docs/</text>
    <text x="360" y="250" fill="#d1d5db">Materi dokumentasi MDX</text>
    <text x="145" y="295" fill="#fca5a5">lib/</text>
    <text x="360" y="295" fill="#d1d5db">Helper dan konfigurasi source</text>
    <text x="145" y="340" fill="#c4b5fd">public/</text>
    <text x="360" y="340" fill="#d1d5db">Asset static seperti gambar dan SVG</text>
    <text x="145" y="385" fill="#fdba74">next.config.ts</text>
    <text x="360" y="385" fill="#d1d5db">Konfigurasi Next.js</text>
  </g>
  <rect x="115" y="180" width="675" height="2" fill="#374151"/>
  <rect x="115" y="225" width="675" height="2" fill="#374151"/>
  <rect x="115" y="270" width="675" height="2" fill="#374151"/>
  <rect x="115" y="315" width="675" height="2" fill="#374151"/>
  <rect x="115" y="360" width="675" height="2" fill="#374151"/>
  <text x="480" y="480" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Folder app memengaruhi URL, sedangkan folder lain mendukung aplikasi.</text>
</svg>
