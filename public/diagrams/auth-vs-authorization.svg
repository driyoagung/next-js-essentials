<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="960" height="520" rx="28" fill="#111827"/><text x="480" y="60" fill="#f9fafb" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">Authentication vs Authorization</text><rect x="95" y="135" width="330" height="230" rx="24" fill="#1f2937" stroke="#38bdf8" stroke-width="3"/><text x="260" y="185" fill="#7dd3fc" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">Authentication</text><text x="260" y="240" fill="#e5e7eb" font-family="Arial" font-size="22" text-anchor="middle">Siapa user ini?</text><text x="260" y="285" fill="#e5e7eb" font-family="Arial" font-size="20" text-anchor="middle">Login, register, session</text><rect x="535" y="135" width="330" height="230" rx="24" fill="#1f2937" stroke="#22c55e" stroke-width="3"/><text x="700" y="185" fill="#86efac" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">Authorization</text><text x="700" y="240" fill="#e5e7eb" font-family="Arial" font-size="22" text-anchor="middle">Boleh melakukan apa?</text><text x="700" y="285" fill="#e5e7eb" font-family="Arial" font-size="20" text-anchor="middle">Role, permission, ownership</text><text x="480" y="455" fill="#cbd5e1" font-family="Arial" font-size="22" text-anchor="middle">User login belum tentu boleh mengakses semua data atau action.</text></svg>