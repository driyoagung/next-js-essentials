<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Navigasi Next.js</title>
  <desc id="desc">Diagram memilih Link, useRouter, redirect, useParams, dan useSearchParams sesuai kebutuhan navigasi.</desc>
  <rect width="960" height="520" rx="28" fill="#0f172a"/>
  <text x="480" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Navigasi di Next.js</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="115" width="230" height="110" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="195" y="158" fill="#7dd3fc" font-size="25" font-weight="700" text-anchor="middle">Link</text>
    <text x="195" y="193" fill="#e2e8f0" font-size="19" text-anchor="middle">Menu dan link biasa</text>
    <rect x="365" y="115" width="230" height="110" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <text x="480" y="158" fill="#86efac" font-size="25" font-weight="700" text-anchor="middle">useRouter</text>
    <text x="480" y="193" fill="#e2e8f0" font-size="19" text-anchor="middle">Klik dan event client</text>
    <rect x="650" y="115" width="230" height="110" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="765" y="158" fill="#fbbf24" font-size="25" font-weight="700" text-anchor="middle">redirect</text>
    <text x="765" y="193" fill="#e2e8f0" font-size="19" text-anchor="middle">Redirect di server</text>
    <rect x="220" y="285" width="230" height="110" rx="20" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
    <text x="335" y="328" fill="#c4b5fd" font-size="25" font-weight="700" text-anchor="middle">useParams</text>
    <text x="335" y="363" fill="#e2e8f0" font-size="19" text-anchor="middle">Baca /products/[id]</text>
    <rect x="510" y="285" width="250" height="110" rx="20" fill="#1e293b" stroke="#fb7185" stroke-width="3"/>
    <text x="635" y="328" fill="#fda4af" font-size="25" font-weight="700" text-anchor="middle">useSearchParams</text>
    <text x="635" y="363" fill="#e2e8f0" font-size="19" text-anchor="middle">Baca ?page=2</text>
  </g>
  <text x="480" y="470" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Pilih alat navigasi sesuai konteks: link, event client, redirect server, params, atau query.</text>
</svg>
