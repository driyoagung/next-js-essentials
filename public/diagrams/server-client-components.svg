<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="960" height="520" rx="28" fill="#0f172a"/><text x="480" y="60" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">Server Component vs Client Component</text><rect x="80" y="120" width="340" height="270" rx="24" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="250" y="170" fill="#86efac" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle">Server Component</text><text x="250" y="220" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Fetch data</text><text x="250" y="260" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Baca database/secret</text><text x="250" y="300" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Kurangi JS browser</text><text x="250" y="340" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Default App Router</text><rect x="540" y="120" width="340" height="270" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="710" y="170" fill="#7dd3fc" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle">Client Component</text><text x="710" y="220" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">useState/useEffect</text><text x="710" y="260" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Event handler</text><text x="710" y="300" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Browser API</text><text x="710" y="340" fill="#e2e8f0" font-family="Arial" font-size="22" text-anchor="middle">Butuh hydration</text><path d="M430 255H530" stroke="#facc15" stroke-width="5" stroke-linecap="round"/><path d="M514 239L530 255L514 271" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="460" fill="#cbd5e1" font-family="Arial" font-size="22" text-anchor="middle">Mu