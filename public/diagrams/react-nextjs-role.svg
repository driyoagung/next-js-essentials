<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">React dan Next.js</title>
  <desc id="desc">Diagram menunjukkan React sebagai fondasi UI dan Next.js sebagai framework aplikasi di atasnya.</desc>
  <rect width="960" height="520" rx="28" fill="#0f172a"/>
  <text x="480" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">React vs Next.js: Peran Utama</text>
  <rect x="80" y="130" width="340" height="260" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="250" y="180" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">React</text>
  <text x="250" y="226" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Membuat komponen UI</text>
  <text x="250" y="266" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">JSX, props, state</text>
  <text x="250" y="306" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Interaksi tampilan</text>
  <rect x="540" y="130" width="340" height="260" rx="24" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="710" y="180" fill="#86efac" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Next.js</text>
  <text x="710" y="226" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Routing dan layout</text>
  <text x="710" y="266" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Rendering dan data</text>
  <text x="710" y="306" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Build dan production</text>
  <path d="M430 260H530" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
  <path d="M514 244L530 260L514 276" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="440" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">React membuat UI, Next.js menyusun UI menjadi aplikasi web lengkap.</text>
</svg>
