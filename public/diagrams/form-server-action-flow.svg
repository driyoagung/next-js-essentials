<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="960" height="520" rx="28" fill="#0f172a"/><text x="480" y="60" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">Alur Form dan Server Action</text><g font-family="Arial"><rect x="55" y="185" width="165" height="100" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="138" y="244" fill="#7dd3fc" font-size="22" font-weight="700" text-anchor="middle">Submit Form</text><rect x="260" y="185" width="165" height="100" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="343" y="244" fill="#86efac" font-size="22" font-weight="700" text-anchor="middle">FormData</text><rect x="465" y="185" width="165" height="100" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="548" y="244" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">Server Action</text><rect x="670" y="185" width="165" height="100" rx="18" fill="#1e293b" stroke="#fb7185" stroke-width="3"/><text x="753" y="244" fill="#fda4af" font-size="22" font-weight="700" text-anchor="middle">Mutation</text></g><path d="M230 235H250M435 235H455M640 235H660" stroke="#facc15" stroke-width="5"/><rect x="250" y="345" width="460" height="75" rx="20" fill="#111827" stroke="#a78bfa" stroke-width="3"/><text x="480" y="392" fill="#c4b5fd" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle">Validate → Revalidate → Redirect / Return State</text><text x="480" y="470" fill="#cbd5e1" font-family="Arial" font-size="22" text-anchor="middle">Server Action tetap request POST, jadi input dan akses harus divalidasi di server.</text></svg>