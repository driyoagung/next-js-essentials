<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="960" height="520" rx="28" fill="#111827"/><text x="480" y="60" fill="#f9fafb" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">Cache vs Fresh Data</text><rect x="90" y="125" width="330" height="260" rx="24" fill="#1f2937" stroke="#22c55e" stroke-width="3"/><text x="255" y="175" fill="#86efac" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle">force-cache</text><text x="255" y="225" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Data jarang berubah</text><text x="255" y="265" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Sama untuk banyak user</text><text x="255" y="305" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Lebih cepat</text><rect x="540" y="125" width="330" height="260" rx="24" fill="#1f2937" stroke="#fb7185" stroke-width="3"/><text x="705" y="175" fill="#fda4af" font-family="Arial" font-size="29" font-weight="700" text-anchor="middle">no-store</text><text x="705" y="225" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Data personal</text><text x="705" y="265" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Harus selalu fresh</text><text x="705" y="305" fill="#e5e7eb" font-family="Arial" font-size="21" text-anchor="middle">Per request</text><text x="480" y="455" fill="#cbd5e1" font-family="Arial" font-size="22" text-anchor="middle">Cache mempercepat aplikasi, tetapi freshness tetap harus dipikirkan.</text></svg>