<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Root Layout dan Children</title>
  <desc id="desc">Diagram menunjukkan root layout sebagai pembungkus dan children sebagai slot halaman aktif.</desc>
  <rect width="960" height="520" rx="28" fill="#0f172a"/>
  <text x="480" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Root Layout dan Children</text>
  <rect x="120" y="105" width="720" height="335" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <text x="480" y="150" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">app/layout.tsx</text>
  <rect x="180" y="185" width="600" height="65" rx="16" fill="#334155"/>
  <text x="480" y="226" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Navbar / Provider / CSS Global</text>
  <rect x="180" y="275" width="600" height="105" rx="18" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <text x="480" y="318" fill="#86efac" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">{children}</text>
  <text x="480" y="352" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">Slot untuk page aktif</text>
  <text x="480" y="475" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Jika user membuka /about, isi app/about/page.tsx masuk ke children.</text>
</svg>
